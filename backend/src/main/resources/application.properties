spring.application.name=nexus
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${POSTGRES_USER:nexus}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.sql.init.mode=always
spring.datasource.hikari.connection-timeout=5000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
nexus.intelligence-url=${INTELLIGENCE_URL:http://localhost:8000}
nexus.demo-dir=${DEMO_DIR:../data/demo}
nexus.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8080}
nexus.auth.secret=${NEXUS_JWT_SECRET:}
nexus.auth.admin-hash=${NEXUS_ADMIN_PASSWORD_HASH:}
nexus.auth.investigator-hash=${NEXUS_INVESTIGATOR_PASSWORD_HASH:}
nexus.auth.viewer-hash=${NEXUS_VIEWER_PASSWORD_HASH:}
nexus.auth.ttl-seconds=${NEXUS_TOKEN_TTL_SECONDS:3600}
