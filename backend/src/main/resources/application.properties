spring.application.name=nexus
server.port=8081
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${POSTGRES_USER:nexus}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
nexus.intelligence-url=${INTELLIGENCE_URL:http://localhost:8000}
nexus.demo-dir=${DEMO_DIR:../data/demo}
nexus.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8080}
