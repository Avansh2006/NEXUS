name: NEXUS verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r intelligence/requirements.txt -r scripts/requirements-dev.txt
      - run: python -m pytest -q intelligence scripts/test_setup_credentials.py scripts/test_verify_features.py
      - run: mvn -B -f backend/pom.xml test
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - name: Reproducible data
        run: python scripts/generate_demo.py && git diff --exit-code -- data/demo
  compose-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL stack, persistence, service recovery, and browser journeys
        run: |
          mkdir -p artifacts/azure
          git rev-parse HEAD > artifacts/azure/source-revision.txt
          bash scripts/test-azure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-verification
          path: artifacts/
