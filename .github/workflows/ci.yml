name: NEXUS verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r intelligence/requirements.txt
      - run: python -m pytest -q intelligence
      - run: mvn -B -f backend/pom.xml test
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - name: Reproducible data
        run: python scripts/generate_demo.py && git diff --exit-code -- data/demo
  compose-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start actual PostgreSQL stack
        env:
          POSTGRES_PASSWORD: nexus-ci-ephemeral-only
        run: docker compose up --build -d
      - name: Wait for API and run clean rehearsal
        env:
          NEXUS_API: http://localhost:8080/api
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health; then break; fi
            sleep 2
          done
          python scripts/verify_demo.py
      - name: Show service logs
        if: failure()
        env:
          POSTGRES_PASSWORD: nexus-ci-ephemeral-only
        run: docker compose logs --tail=100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --global pnpm@11.19.0
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Rehearse desktop and mobile UI
        run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-verification
          path: artifacts/
